<svg xmlns="http://www.w3.org/2000/svg" width="360" height="78" viewBox="0 0 360 78" role="img" aria-labelledby="t d">
  <title id="t">Email Victor Boar</title><desc id="d">A modern animated glass button opening a new email to Victor.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101126"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.17"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="360" height="78" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="360" height="78" fill="url(#card)"/>
    <circle cx="354" cy="0" r="86" fill="#8b5cf6" opacity="0.11"><animate attributeName="r" values="72;96;72" dur="6.7s" repeatCount="indefinite"/></circle>
    <rect x="-100" width="70" height="78" fill="url(#shine)" transform="skewX(-18)"><animate attributeName="x" values="-100;450" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="17" y="16" width="46" height="46" rx="14" fill="#7c3aed"/>
    <rect x="28" y="29" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2.3"/>
    <path d="M29 31l11 8 11-8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="79" y="34" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700">Email</text>
    <text x="79" y="54" fill="#a8a9bc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">rotcivraob@yahoo.com</text>
    <circle cx="328" cy="39" r="18" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/>
    <path d="M322 39h11m-4-4 4 4-4 4" fill="none" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="-2 0;3 0;-2 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="358" height="76" rx="19" fill="none" stroke="#a78bfa" stroke-opacity="0.27"/>
</svg>
