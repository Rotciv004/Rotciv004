<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="t d">
  <title id="t">Profile footer</title><desc id="d">A modern animated aurora footer with Victor's engineering motto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#050816"/><stop offset="0.52" stop-color="#09152c"/><stop offset="1" stop-color="#11102b"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="0.52" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#67e8f9" stop-opacity="0.7"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frame"><rect width="1200" height="140" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <ellipse cx="940" cy="142" rx="350" ry="100" fill="#8b5cf6" opacity="0.16" filter="url(#blur)"><animate attributeName="cx" values="940;790;940" dur="13s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="260" cy="145" rx="340" ry="90" fill="#0ea5e9" opacity="0.17" filter="url(#blur)"><animate attributeName="cx" values="260;400;260" dur="15s" repeatCount="indefinite"/></ellipse>
    <path d="M0 113C175 78 345 137 532 103S886 78 1200 111V140H0z" fill="url(#wave)" opacity="0.13">
      <animate attributeName="d" values="M0 113C175 78 345 137 532 103S886 78 1200 111V140H0z;M0 103C190 134 350 75 555 111S914 135 1200 101V140H0z;M0 113C175 78 345 137 532 103S886 78 1200 111V140H0z" dur="12s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600">From algorithms to interfaces. From sensors to services.</text>
    <rect x="510" y="82" width="180" height="3" rx="2" fill="url(#wave)" opacity="0.7"/>
    <circle cx="520" cy="83.5" r="20" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="520;680;520" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="1198" height="138" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
