<svg xmlns="http://www.w3.org/2000/svg" width="360" height="78" viewBox="0 0 360 78" role="img" aria-labelledby="t d">
  <title id="t">Victor Boar on LinkedIn</title><desc id="d">A modern animated glass button opening Victor's professional LinkedIn profile.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#0a66c2" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="360" height="78" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="360" height="78" fill="url(#card)"/>
    <circle cx="354" cy="0" r="86" fill="#0a66c2" opacity="0.12"><animate attributeName="r" values="72;96;72" dur="6s" repeatCount="indefinite"/></circle>
    <rect x="-100" width="70" height="78" fill="url(#shine)" transform="skewX(-18)"><animate attributeName="x" values="-100;450" dur="5.5s" repeatCount="indefinite"/></rect>
    <rect x="17" y="16" width="46" height="46" rx="14" fill="#0a66c2"/>
    <text x="40" y="48" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="800">in</text>
    <text x="79" y="34" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700">LinkedIn</text>
    <text x="79" y="54" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">Professional profile</text>
    <circle cx="328" cy="39" r="18" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/>
    <path d="M322 39h11m-4-4 4 4-4 4" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="-2 0;3 0;-2 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="358" height="76" rx="19" fill="none" stroke="#38bdf8" stroke-opacity="0.28"/>
</svg>
